<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1132"><rect width="800" height="1132" fill="#f4efe5"/><text x="70" y="120" font-family="Georgia" font-size="54" fill="#29241f">A page is not a screen.</text><text x="70" y="175" font-family="Inter" font-size="16" fill="#7c6d5d">It is a physical idea translated into a digital surface.</text><path d="M70 300 C250 220 450 370 730 280" fill="none" stroke="#b27752" stroke-width="4"/><path d="M70 335 C250 255 450 405 730 315" fill="none" stroke="#b27752" stroke-opacity=".35" stroke-width="2"/><text x="70" y="500" font-family="Inter" font-size="16" fill="#4c443c">Depth, shadow, light, grain and motion should support the content.</text></svg>