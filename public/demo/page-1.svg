<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1132"><rect width="800" height="1132" fill="#f7f2e8"/><text x="70" y="120" font-family="Georgia,serif" font-size="30" fill="#25211c">AIRPAGES</text><text x="70" y="180" font-family="Inter,sans-serif" font-size="16" fill="#8d7966">A document can become a place to study.</text><text x="70" y="300" font-family="Georgia,serif" font-size="62" fill="#25211c">Read one page.</text><text x="70" y="370" font-family="Georgia,serif" font-size="62" fill="#25211c">Understand it.</text><path d="M70 450H730" stroke="#d2c5b6"/><text x="70" y="520" font-family="Inter,sans-serif" font-size="17" fill="#4a423b">Immersive reading, precise navigation, and study tools.</text></svg>